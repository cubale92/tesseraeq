name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target TesseraTests
      - name: Run tests
        run: xvfb-run -a ./build/TesseraTests_artefacts/Release/TesseraTests

  build-windows:
    name: VST3 (Windows x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DTESSERA_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --target TesseraEQ_VST3 --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: TesseraEQ-VST3-Windows
          path: build/TesseraEQ_artefacts/Release/VST3/

  build-macos:
    name: VST3 + AU (macOS universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build -G Xcode -DTESSERA_BUILD_TESTS=OFF
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DTESSERA_FORMATS="VST3;AU"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: TesseraEQ-macOS
          path: |
            build/TesseraEQ_artefacts/Release/VST3/
            build/TesseraEQ_artefacts/Release/AU/
