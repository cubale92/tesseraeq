name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish the download page (Releases)

jobs:
  build-windows:
    name: VST3 + tests + pluginval (Windows x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Check the plugin needs no extra runtime DLLs
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem -Recurse "$vs\VC\Tools\MSVC" -Filter dumpbin.exe | Where-Object { $_.FullName -like '*Hostx64\x64*' } | Select-Object -First 1
          $dll = Get-ChildItem -Recurse "build\TesseraEQ_artefacts\Release\VST3" -Filter "*.vst3" -File | Select-Object -First 1
          Write-Output "Binary: $($dll.FullName)"
          $deps = & $dumpbin.FullName /dependents $dll.FullName
          $deps | Write-Output
          $bad = $deps | Select-String -Pattern 'VCRUNTIME|MSVCP|ucrtbased|api-ms-win-crt'
          if ($bad) { $bad | ForEach-Object { Write-Output "::error::Plugin depends on $($_.Line.Trim())" }; exit 1 }
          Write-Output "::notice::Plugin only depends on DLLs that ship with Windows"
      - name: Run tests
        run: '& "build/TesseraTests_artefacts/Release/TesseraTests.exe" "$env:RUNNER_TEMP\tessera-windows.png"'
      - name: pluginval
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          $exe = Get-ChildItem -Recurse pv -Filter pluginval.exe | Select-Object -First 1
          Write-Output "pluginval at: $($exe.FullName)"
          & $exe.FullName --strictness-level 10 --validate-in-process "build\TesseraEQ_artefacts\Release\VST3\Tessera EQ.vst3" 2>&1 | Tee-Object -FilePath pluginval.log
          $code = $LASTEXITCODE
          # surface failures as annotations so they are visible without downloading logs
          Select-String -Path pluginval.log -Pattern '!!!|FAILED|\*\*\* FAILED|Exception|crash' | Select-Object -First 8 | ForEach-Object { Write-Output "::error::$($_.Line)" }
          Get-Content pluginval.log -Tail 6 | ForEach-Object { if ($_.Trim()) { Write-Output "::warning::$_" } }
          if ($code -ne 0) { exit 1 }
      - name: Publish Windows download (Releases page)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path "build\TesseraEQ_artefacts\Release\VST3\Tessera EQ.vst3" -DestinationPath "TesseraEQ-Windows-VST3.zip" -Force
          gh release view latest *> $null
          if ($LASTEXITCODE -ne 0) { gh release create latest --title "Tessera EQ (latest build)" --notes "Download the zip for your system below, unzip it and copy the plugin into your plugin folder (see the README)." --target $env:GITHUB_SHA }
          gh release upload latest "TesseraEQ-Windows-VST3.zip" --clobber
      - name: Upload VST3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TesseraEQ-VST3-Windows
          path: build/TesseraEQ_artefacts/Release/VST3/
      - name: Upload editor screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-screenshot-windows
          path: ${{ runner.temp }}/tessera-windows.png

  build-macos:
    name: VST3 + AU + pluginval (macOS universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -B build -G Xcode -DTESSERA_BUILD_TESTS=OFF
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DTESSERA_FORMATS="VST3;AU"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process "build/TesseraEQ_artefacts/Release/VST3/Tessera EQ.vst3" 2>&1 | tee pluginval.log
          code=${PIPESTATUS[0]}
          grep -E '!!!|FAILED' pluginval.log | head -8 | sed 's/^/::error::/' || true
          exit $code
      - name: Publish Mac download (Releases page)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/TesseraEQ_artefacts/Release
          ditto -c -k --keepParent "VST3/Tessera EQ.vst3" "$GITHUB_WORKSPACE/TesseraEQ-Mac-VST3.zip"
          ditto -c -k --keepParent "AU/Tessera EQ.component" "$GITHUB_WORKSPACE/TesseraEQ-Mac-AU.zip"
          cd "$GITHUB_WORKSPACE"
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "Tessera EQ (latest build)" --notes "Download the zip for your system below, unzip it and copy the plugin into your plugin folder (see the README)." --target "$GITHUB_SHA" || true
          gh release upload latest TesseraEQ-Mac-VST3.zip TesseraEQ-Mac-AU.zip --clobber
      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: TesseraEQ-macOS
          path: |
            build/TesseraEQ_artefacts/Release/VST3/
            build/TesseraEQ_artefacts/Release/AU/

  build-mpc:
    name: MPC OS VST2 (armv7 Gen1/Force + aarch64 Gen2)
    runs-on: ubuntu-24.04
    env:
      MPC_VST: ${{ github.workspace }}/../mpc-vst-plugins
      MPC_VST_SHA: adc48a35e8e190cd4c7a1adb20da5a4cce2fdea4   # sd88me/mpc-vst-plugins, pinned
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Get the MPC VST toolkit (pinned commit)
        run: |
          git clone https://github.com/sd88me/mpc-vst-plugins "$MPC_VST"
          git -C "$MPC_VST" checkout --quiet "$MPC_VST_SHA"
      - name: Offline host test (x86, ASan)
        run: '"$MPC_VST/tools/test_port.sh" mpc/vst.json'
      - name: DSP accuracy tests
        run: |
          gcc -O1 -g -fsanitize=address,undefined -I"$MPC_VST/wrapper" -Impc/build mpc/tests/test_engine.c mpc/engine.c -lm -o mpc/build/test_engine
          ./mpc/build/test_engine
      - name: Build for the device (armv7 + aarch64)
        run: '"$MPC_VST/tools/build_port.sh" mpc/vst.json all'
      - name: Package installer zips
        run: |
          VER=$(python3 -c "import json;v=json.load(open('mpc/vst.json'))['version'];print('%d.%d.%d'%(v//1000,v%1000//100,v%100//10))")
          for so in mpc/build/tessera_eq.so mpc/build/aarch64/tessera_eq.so; do
            python3 "$MPC_VST/tools/release.py" --so "$so" --skin "mpc/build/skin/8cee - VST - Tessera EQ" \
              --entry mpc/build/pluginlist-entry.xml --version "$VER" \
              --about "8-band EQ with mid/side and dynamic EQ, boom bap and new jack swing presets." -o dist
          done
          ls -l dist
      - name: Publish MPC downloads (Releases page)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "Tessera EQ (latest build)" --notes "Download the zip for your system below." --target "$GITHUB_SHA" || true
          gh release upload latest dist/*.zip --clobber
      - name: Upload MPC zips
        uses: actions/upload-artifact@v4
        with:
          name: TesseraEQ-MPC
          path: dist/*.zip
